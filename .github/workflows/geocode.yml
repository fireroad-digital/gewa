name: Geocode Dealer Data

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC
  workflow_dispatch:       # Allow manual trigger from GitHub Actions UI

jobs:
  geocode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --prefix scripts

      - name: Run geocoding script
        run: node scripts/geocode.js

      - name: Validate dealer data
        id: validate
        run: node scripts/validate-data.js

      - name: Alert Slack on validation failure
        if: failure() && steps.validate.outcome == 'failure'
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            -d '{
              "text": ":warning: *GEWA geocoding validation failed* — dealer data was NOT committed.\nCheck the workflow run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'

      - name: Commit updated dealer data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update geocoded dealer data'
          file_pattern: 'data/*.json'
          branch: release
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
